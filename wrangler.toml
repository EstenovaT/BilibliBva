# Cloudflare Worker 配置 —— B站视频在线解析
# 文档: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "bva-resolve"
main = "index.js"
compatibility_date = "2025-01-01"

# 静态网页目录（相对于本文件所在目录）→ src/webui
# 网页文件、API、302 永久链接由同一个 Worker 提供，同源无跨域问题
# run_worker_first = true：所有请求先进入 Worker（否则 /?bv=... 会被
# 静态资源 index.html 直接命中，永久链接 302 跳转不生效），
# 再由 Worker 决定用 env.ASSETS.fetch() 返回网页
assets = { directory = "src/webui", binding = "ASSETS", run_worker_first = true }

[vars]
# 视频代理播放（/proxy）：
#   0 = 关闭（推荐，公开站点省流量；网页上会隐藏「代理播放」按钮）
#   1 = 开启（Worker 转发视频流，注意免费额度 CPU/时长限制）
PROXY = "0"

# ── 国内后端转发模式（推荐，解决 -412）──
# BACKEND_URL：国内 Python 后端的公网地址。配置后，/api/resolve、
#   /pic、/proxy、302 永久链接全部转发给该后端（后端走国内 IP/代理
#   出站调 B 站，无 -412），Worker 只负责网页托管 + 转发。
# 留空 = Worker 直连 B 站（会被 -412 风控，仅本地开发用）。
# 示例：BACKEND_URL = "https://xxxx.trycloudflare.com"
BACKEND_URL = ""

# 部署到正式域名（绑定自定义域 bva.estenova.top）后，永久链接会自动
# 跟随当前域名；本地 wrangler dev 预览时为 http://localhost:8787/...

# ── 可选 Secret（不要写在这里，用 wrangler secret put 或控制台添加）──
# BILI_COOKIE：B 站完整会话 Cookie（推荐，最接近真实浏览器）。
#   浏览器登录 bilibili.com 后，F12 → 应用 → Cookie → 复制全部 Cookie 字符串，
#   含 buvid3/buvid4/bili_ticket/SESSDATA 等，可绕过 Cloudflare 出口 IP 的 -412。
# SESSDATA：仅登录 Cookie 的 SESSDATA 项（简便备选；playurl 接口可能仍被 412）。
# 配置方式（二选一）：
#   pnpm exec wrangler secret put BILI_COOKIE
#   或 Cloudflare 控制台 → Workers → bva-resolve → Settings → Variables and
#   Secrets → Add secret → 名称 BILI_COOKIE，值粘贴 Cookie 字符串。
# ⚠️ Cookie 是账号凭证，请勿提交到仓库或泄露；登录失效后需重新获取。
