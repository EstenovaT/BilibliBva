# B站解析 - Nginx 站点配置（DNS only 直连部署用）
# 用法：
#   1. 服务器安装 nginx、certbot：
#        sudo apt update && sudo apt install -y nginx certbot python3-certbot-nginx
#   2. 复制本文件到 /etc/nginx/sites-available/bva.estenova.top
#   3. 启用站点：
#        sudo ln -s /etc/nginx/sites-available/bva.estenova.top /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#   4. 申请证书（自动配置 HTTPS 跳转）：
#        sudo certbot --nginx -d bva.estenova.top
#   5. 验证：浏览器访问 https://bva.estenova.top/
# 前置：DNS 记录为 A 记录指向本服务器 IP，且【代理关闭（灰云/DNS only）】

server {
    listen 80;
    server_name bva.estenova.top;

    # certbot HTTP-01 验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余 HTTP 一律跳 HTTPS（certbot --nginx 会自动加）
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name bva.estenova.top;

    ssl_certificate     /etc/letsencrypt/live/bva.estenova.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bva.estenova.top/privkey.pem;

    # 视频流代理：关闭缓冲，边收边转（代理播放时必要）
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
