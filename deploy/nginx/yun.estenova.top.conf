# B站解析后端 - Nginx 配置（yun.estenova.top → 127.0.0.1:12680）
# 用途：给解析后端提供 HTTPS（浏览器 HTTPS 页面才能调用，避免混合内容拦截）
# 用法：
#   1. sudo apt install -y nginx certbot python3-certbot-nginx
#   2. 复制本文件到 /etc/nginx/sites-available/yun.estenova.top
#   3. sudo ln -s /etc/nginx/sites-available/yun.estenova.top /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d yun.estenova.top
# 前置：Cloudflare DNS 里 yun.estenova.top 是 A 记录指向本服务器（灰云/DNS only）

server {
    listen 80;
    server_name yun.estenova.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name yun.estenova.top;

    ssl_certificate     /etc/letsencrypt/live/yun.estenova.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yun.estenova.top/privkey.pem;

    # CORS：允许 Cloudflare 网页端跨域调用
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Referer, User-Agent" always;

    # 视频流：关闭缓冲，边收边转
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:12680;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
