<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B站在线解析</title>
<style>
  :root {
    --bg: #fff0f5;
    --card: #ffffff;
    --border: #ffd3e0;
    --text: #4a3f45;
    --muted: #b3899a;
    --accent: #fb7299;
    --accent2: #e85d8a;
    --ok: #67c23a;
    --err: #e5484d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(160deg, #ffe3ec 0%, #fff5f8 45%, #ffeef4 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }
  header {
    padding: 28px 16px 14px;
    text-align: center;
  }
  header h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p { color: var(--muted); font-size: 13px; margin-top: 4px; }
  main { max-width: 720px; margin: 0 auto; padding: 8px 16px 60px; }

  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  .input-row input:focus { border-color: var(--accent); }
  .input-row button {
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: filter .2s;
    white-space: nowrap;
  }
  .input-row button:hover { filter: brightness(1.1); }
  .input-row button:disabled { opacity: .6; cursor: not-allowed; }

  .status { margin-top: 12px; font-size: 14px; min-height: 20px; }
  .status.loading { color: var(--accent2); }
  .status.error { color: var(--err); }
  .status.ok { color: var(--ok); }

  .card {
    margin-top: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .hidden { display: none !important; }

  .video-head { display: flex; gap: 14px; }
  .video-head img {
    width: 160px;
    height: 100px;
    object-fit: cover;
    border-radius: 8px;
    background: #ffd3e0;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .video-head .info { min-width: 0; }
  .video-head .title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
    word-break: break-all;
  }
  .video-head .meta { font-size: 13px; color: var(--muted); }
  .video-head .meta span { margin-right: 10px; }
  .up { color: var(--accent2); }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 14px;
  }
  .stats .item {
    background: var(--bg);
    border-radius: 8px;
    padding: 8px 4px;
    text-align: center;
  }
  .stats .num { font-size: 15px; font-weight: 700; }
  .stats .label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .desc {
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
    max-height: 72px;
    overflow: hidden;
    white-space: pre-wrap;
    word-break: break-all;
    position: relative;
  }
  .desc.expanded { max-height: none; }
  .desc-toggle {
    margin-top: 4px;
    font-size: 12px;
    color: var(--accent2);
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 14px;
    align-items: center;
  }
  .controls label { font-size: 13px; color: var(--muted); }
  .controls select {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }
  .controls .reparse {
    margin-left: auto;
    padding: 7px 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent2);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .links { margin-top: 14px; }
  .link-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .link-row .tag {
    font-size: 12px;
    color: #fff;
    background: var(--accent);
    border-radius: 4px;
    padding: 2px 6px;
    flex-shrink: 0;
  }
  .link-row .tag.perma { background: var(--accent2); }
  .link-row .url {
    flex: 1;
    font-size: 12px;
    color: var(--muted);
    word-break: break-all;
    min-width: 0;
  }
  .link-row .copy {
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all .2s;
  }
  .link-row .copy:hover { border-color: var(--accent); color: var(--accent); }

  .player { margin-top: 14px; }
  .player video {
    width: 100%;
    max-height: 405px;
    background: #000;
    border-radius: 8px;
  }
  .play-btns { display: flex; gap: 8px; margin-top: 8px; }
  .play-btns button {
    flex: 1;
    padding: 9px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: filter .2s;
  }
  .play-btns button:hover { filter: brightness(1.05); }
  #btnProxy { background: linear-gradient(135deg, #fb7299, #e85d8a); color: #fff; }
  #btnDirect { background: var(--card); color: var(--accent); border: 1px solid var(--border); }

  .note { margin-top: 10px; font-size: 12px; color: var(--muted); }

  footer {
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 12px;
  }
  @media (max-width: 560px) {
    .video-head { flex-direction: column; }
    .video-head img { width: 100%; height: 180px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .controls .reparse { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>B站视频在线解析</h1>
  <p>粘贴 B站链接 / BV号 / AV号，一键获取视频信息与播放直链</p>
</header>
<main>
  <div class="input-row">
    <input id="url" type="text" autocomplete="off"
      placeholder="例如：https://www.bilibili.com/video/BV1xx411c7mD 或 BV1xx411c7mD">
    <button id="btn">解析</button>
  </div>
  <div id="status" class="status"></div>

  <div id="result" class="hidden">
    <div class="card">
      <div class="video-head">
        <img id="cover" src="" alt="封面" onerror="this.style.visibility='hidden'">
        <div class="info">
          <div class="title" id="title"></div>
          <div class="meta">
            <span>UP主：<span class="up" id="uploader"></span></span>
            <span id="tname"></span>
            <span id="duration"></span>
            <span id="pubdate"></span>
          </div>
          <div class="meta" style="margin-top:4px">
            <span id="bvidText"></span>
            <span id="pageText"></span>
          </div>
        </div>
      </div>

      <div class="stats">
        <div class="item"><div class="num" id="stView">-</div><div class="label">播放</div></div>
        <div class="item"><div class="num" id="stDanmaku">-</div><div class="label">弹幕</div></div>
        <div class="item"><div class="num" id="stReply">-</div><div class="label">评论</div></div>
        <div class="item"><div class="num" id="stLike">-</div><div class="label">点赞</div></div>
        <div class="item"><div class="num" id="stCoin">-</div><div class="label">投币</div></div>
        <div class="item"><div class="num" id="stFavorite">-</div><div class="label">收藏</div></div>
        <div class="item"><div class="num" id="stShare">-</div><div class="label">转发</div></div>
        <div class="item"><div class="num" id="stSize">-</div><div class="label">大小</div></div>
      </div>

      <div class="desc" id="desc"></div>
      <button class="desc-toggle hidden" id="descToggle">展开简介</button>

      <div class="controls">
        <label>分P <select id="selPage"></select></label>
        <label>画质 <select id="selQuality">
          <option value="120">4K</option>
          <option value="116">1080P60</option>
          <option value="112">1080P+</option>
          <option value="80" selected>1080P</option>
          <option value="64">720P</option>
          <option value="32">480P</option>
          <option value="16">360P</option>
        </select></label>
        <button class="reparse" id="btnReparse">重新解析</button>
      </div>

      <div class="links">
        <div class="link-row">
          <span class="tag" id="qualityTag">直链</span>
          <span class="url" id="mp4Url">-</span>
          <button class="copy" data-copy="mp4">复制</button>
        </div>
        <div class="link-row">
          <span class="tag perma">永久</span>
          <span class="url" id="permUrl">-</span>
          <button class="copy" data-copy="perm">复制</button>
        </div>
        <div class="link-row">
          <span class="tag">B站</span>
          <span class="url" id="biliUrl">-</span>
          <button class="copy" data-copy="bili">复制</button>
        </div>
      </div>

      <div class="player">
        <video id="video" controls preload="metadata"></video>
        <div class="play-btns">
          <button id="btnProxy">代理播放（推荐）</button>
          <button id="btnDirect">直接播放</button>
        </div>
        <div class="note" id="playNote">
          ⚠️ 1080P 及以上画质受 B 站防盗链限制，「直接播放」可能失败（403）；
          推荐使用「代理播放」——由服务器转发视频流并携带 B 站 Referer，可正常播放。
        </div>
      </div>
    </div>
  </div>
</main>
<footer>bva.estenova.top · B站视频解析服务</footer>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var urlInput = $("url"), btn = $("btn"), statusEl = $("status");
  var resultEl = $("result"), video = $("video");

  var QUALITIES = [120, 116, 112, 80, 64, 32, 16];
  var QUALITY_NAMES = { 120: "4K", 116: "1080P60", 112: "1080P+", 80: "1080P",
                        74: "720P60", 64: "720P", 32: "480P", 16: "360P" };
  var DEFAULT_QN = 80; // 默认 1080P

  // 完全版标记：访问 /ex 时开启代理播放（隐藏功能，默认页面不显示）
  var EX = location.pathname === "/ex";

  var currentInput = "";

  function fmtNum(n) {
    if (n === null || n === undefined) return "-";
    if (n >= 100000000) return (n / 100000000).toFixed(1) + "亿";
    if (n >= 10000) return (n / 10000).toFixed(1) + "万";
    return String(n);
  }
  function fmtSize(b) {
    if (!b) return "-";
    if (b >= 1073741824) return (b / 1073741824).toFixed(1) + "GB";
    if (b >= 1048576) return (b / 1048576).toFixed(1) + "MB";
    if (b >= 1024) return (b / 1024).toFixed(0) + "KB";
    return b + "B";
  }
  function setStatus(msg, cls) {
    statusEl.textContent = msg || "";
    statusEl.className = "status" + (cls ? " " + cls : "");
  }
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); resolve(); }
      catch (e) { reject(e); }
      document.body.removeChild(ta);
    });
  }

  function parse() {
    var input = urlInput.value.trim();
    if (!input) { setStatus("请输入链接或 BV/AV 号", "error"); return; }
    currentInput = input;
    doRequest(1, parseInt($("selQuality").value, 10) || DEFAULT_QN);
  }

  function doRequest(page, qn) {
    setStatus("解析中…", "loading");
    btn.disabled = true;
    video.pause();
    video.removeAttribute("src");
    video.load();

    var qs = new URLSearchParams({ url: currentInput, p: String(page), qn: String(qn) });
    if (EX) qs.set("ex", "1");
    fetch("/api/resolve?" + qs.toString())
      .then(function (resp) { return resp.json().catch(function () {
        throw new Error("服务器返回异常 (HTTP " + resp.status + ")");
      }); })
      .then(function (json) {
        btn.disabled = false;
        if (json.code !== 0) {
          setStatus(json.message || "解析失败", "error");
          resultEl.classList.add("hidden");
          return;
        }
        render(json.data);
        setStatus("解析成功 ✓", "ok");
        resultEl.classList.remove("hidden");
      })
      .catch(function (err) {
        btn.disabled = false;
        setStatus("请求失败：" + err.message, "error");
      });
  }

  function render(d) {
    // 封面走后端 /pic 代理（B 站图片 CDN 防盗链，浏览器直连会 403）
    var pic = d.pic || "";
    if (pic.indexOf("//") === 0) pic = "https:" + pic;
    $("cover").src = pic ? ("/pic?url=" + encodeURIComponent(pic)) : "";
    $("cover").style.visibility = "visible";
    $("cover").onerror = function () {
      this.style.visibility = "hidden";
    };
    $("title").textContent = d.title || "未知";
    $("uploader").textContent = d.uploader || "未知";
    $("tname").textContent = d.tname || "";
    $("duration").textContent = "时长 " + d.duration;
    $("pubdate").textContent = d.pubdate ? new Date(d.pubdate * 1000).toLocaleDateString("zh-CN") : "";
    $("bvidText").textContent = d.bvid + (d.aid ? "  av" + d.aid : "");
    $("pageText").textContent = d.pages && d.pages.length > 1
      ? ("分P " + d.page + "/" + d.pages.length + (d.page_title ? " 「" + d.page_title + "」" : ""))
      : "";

    var st = d.stat || {};
    $("stView").textContent = fmtNum(st.view);
    $("stDanmaku").textContent = fmtNum(st.danmaku);
    $("stReply").textContent = fmtNum(st.reply);
    $("stLike").textContent = fmtNum(st.like);
    $("stCoin").textContent = fmtNum(st.coin);
    $("stFavorite").textContent = fmtNum(st.favorite);
    $("stShare").textContent = fmtNum(st.share);
    $("stSize").textContent = fmtSize(d.file_size);

    var descEl = $("desc");
    descEl.textContent = d.desc || "";
    descEl.classList.remove("expanded");
    $("descToggle").classList.toggle("hidden", (d.desc || "").length <= 90);

    var selPage = $("selPage");
    selPage.innerHTML = "";
    (d.pages || []).forEach(function (p, i) {
      var opt = document.createElement("option");
      opt.value = String(i + 1);
      opt.textContent = "P" + (i + 1) + (p.part ? " " + p.part : "");
      selPage.appendChild(opt);
    });
    selPage.value = String(d.page);
    selPage.disabled = !(d.pages && d.pages.length > 1);

    // 画质下拉框：保留用户当前选择，不强制重置（避免“选不上”）
    // 实际返回画质显示在直链标签上，若被 B 站降级则标注
    var reqQn = parseInt($("selQuality").value, 10) || DEFAULT_QN;
    var qName = d.quality_name || "";
    var degraded = d.quality && d.quality > 0 && d.quality !== reqQn;
    $("qualityTag").textContent = qName
      ? ("直链 · " + qName + (degraded ? "（已降级）" : ""))
      : "直链";
    $("mp4Url").textContent = d.mp4_url || "获取失败";
    $("permUrl").textContent = d.perm_link || "-";
    $("biliUrl").textContent = d.bilibili_url || "-";

    // 代理播放：后端开启（proxy_enabled=true）才显示按钮，否则提示改用直链+下载工具
    var proxyOn = !!d.proxy_enabled;
    $("btnProxy").classList.toggle("hidden", !proxyOn);
    $("playNote").textContent = proxyOn
      ? "⚠️ 1080P 及以上画质受 B 站防盗链限制，「直接播放」可能失败（403）；推荐使用「代理播放」——由服务器转发视频流并携带 B 站 Referer，可正常播放。"
      : "⚠️ 浏览器直连播放可能被 B 站防盗链拦截（403）；若无法播放，请复制直链后用 IDM / 迅雷等下载工具（携带 B 站 Referer）下载。";
  }

  // 事件绑定
  btn.addEventListener("click", parse);
  urlInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") parse();
  });
  $("btnReparse").addEventListener("click", function () {
    if (!currentInput) return;
    doRequest(parseInt($("selPage").value, 10) || 1,
              parseInt($("selQuality").value, 10) || DEFAULT_QN);
  });
  $("selPage").addEventListener("change", function () {
    doRequest(parseInt(this.value, 10) || 1,
              parseInt($("selQuality").value, 10) || DEFAULT_QN);
  });
  $("selQuality").addEventListener("change", function () {
    doRequest(parseInt($("selPage").value, 10) || 1,
              parseInt(this.value, 10) || DEFAULT_QN);
  });

  $("descToggle").addEventListener("click", function () {
    var d = $("desc");
    var expanded = d.classList.toggle("expanded");
    this.textContent = expanded ? "收起简介" : "展开简介";
  });

  document.querySelectorAll(".copy").forEach(function (b) {
    b.addEventListener("click", function () {
      var key = this.getAttribute("data-copy");
      var text = key === "mp4" ? $("mp4Url").textContent
               : key === "perm" ? $("permUrl").textContent
               : $("biliUrl").textContent;
      if (!text || text === "-" || text === "获取失败") return;
      copyText(text).then(function () {
        var old = b.textContent;
        b.textContent = "已复制 ✓";
        setTimeout(function () { b.textContent = old; }, 1500);
      }).catch(function () {
        b.textContent = "复制失败";
        setTimeout(function () { b.textContent = "复制"; }, 1500);
      });
    });
  });

  $("btnDirect").addEventListener("click", function () {
    var src = $("mp4Url").textContent;
    if (!src || src.indexOf("http") !== 0) { setStatus("暂无直链", "error"); return; }
    video.src = src;
    video.play().catch(function () { /* 防盗链拦截时静默 */ });
  });

  $("btnProxy").addEventListener("click", function () {
    var src = $("mp4Url").textContent;
    if (!src || src.indexOf("http") !== 0) { setStatus("暂无直链", "error"); return; }
    video.src = "/proxy?url=" + encodeURIComponent(src) + (EX ? "&ex=1" : "");
    video.play().catch(function () { });
  });

  video.addEventListener("error", function () {
    setStatus("视频播放失败：可能被 B 站防盗链拦截，请尝试「代理播放」", "error");
  });
})();
</script>
</body>
</html>
